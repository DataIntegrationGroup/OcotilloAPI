[project]
name = "OcotilloAPI"
version = "0.1.0"
description = "FastAPI backend and CLI for managing Ocotillo groundwater locations, wells, assets, and bulk water-level data transfers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiofiles==24.1.0",
  "aiohappyeyeballs==2.6.1",
  "aiohttp==3.13.3",
  "aiosignal==1.4.0",
  "aiosqlite==0.22.1",
  "alembic==1.18.4",
  "annotated-types==0.7.0",
  "anyio==4.12.1",
  "apitally[fastapi]==0.24.1",
  "asgiref==3.11.1",
  "asn1crypto==1.5.1",
  "asyncpg==0.31.0",
  "attrs==25.4.0",
  "authlib==1.6.9",
  "bcrypt==4.3.0",
  "cachetools==5.5.2",
  "certifi==2025.8.3",
  "cffi==1.17.1",
  "charset-normalizer==3.4.4",
  "click==8.3.1",
  "cloud-sql-python-connector==1.20.0",
  "cryptography==45.0.6",
  "dnspython==2.8.0",
  "dotenv==0.9.9",
  "email-validator==2.3.0",
  "fastapi==0.129.0",
  "fastapi-pagination==0.15.10",
  "frozenlist==1.8.0",
  "geoalchemy2==0.18.1",
  "google-api-core==2.29.0",
  "google-auth==2.48.0",
  "google-cloud-core==2.5.0",
  "google-cloud-storage==3.9.0",
  "google-crc32c==1.8.0",
  "google-resumable-media==2.8.0",
  "googleapis-common-protos==1.72.0",
  "greenlet==3.3.1",
  "gunicorn==23.0.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.11",
  "iniconfig==2.3.0",
  "itsdangerous>=2.2.0",
  "jinja2==3.1.6",
  "mako==1.3.10",
  "markupsafe==3.0.3",
  "multidict==6.7.1",
  "numpy==2.4.2",
  "packaging==25.0",
  "pandas==2.3.2",
  "pandas-stubs~=2.3.2",
  "pg8000==1.31.5",
  "phonenumbers==9.0.24",
  "pillow==11.3.0",
  "pluggy==1.6.0",
  "pre-commit==4.5.1",
  "propcache==0.4.1",
  "proto-plus==1.27.1",
  "protobuf==6.33.5",
  "psycopg2-binary>=2.9.10",
  "pyasn1==0.6.3",
  "pyasn1-modules==0.4.2",
  "pycparser==2.23",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "pygments==2.19.2",
  "pyjwt==2.12.0",
  "pygeoapi==0.22.0",
  "pyproj==3.7.2",
  "pyshp==2.3.1",
