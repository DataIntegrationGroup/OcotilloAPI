[project]
name = "OcotilloAPI"
version = "1.2.0"
description = "FastAPI backend and CLI for managing Ocotillo groundwater locations, wells, assets, and bulk water-level data transfers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
