  "google-cloud-storage==3.13.1",
  "google-crc32c==1.8.0",
  "google-resumable-media==2.10.1",
  "googleapis-common-protos==1.75.1",
  "greenlet==3.5.5",
  "gunicorn==23.0.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.18",
  "iniconfig==2.3.0",
  "jinja2==3.1.6",
  "mako==1.4.1",
  "markupsafe==3.0.3",
  "multidict==6.7.1",
  "numpy==2.5.2",
  "packaging==26.3",
  "pandas==2.3.2",
  "pandas-stubs~=2.3.2",
