name: release-please

on:
  push:
    branches:
      - production
      - 'hotfix/v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
    steps:
      # One version line. Staging deploys every push and is not versioned:
      # the rc line it used to carry cost a second config, a second manifest,
      # a second changelog and a manifest sync on every back-merge, and
      # nothing was tested against an rc tag -- v1.4.0-rc was cut and then 97
      # commits landed before the promotion.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # release-please-action@v5 does not populate a usable `tag_name` output in
      # this manifest setup: it emits `release_created` plus an EMPTY `tag_name`,
      # and no path-scoped (`.--tag_name`) outputs exist. An empty tag makes
      # CD_production's `startsWith(inputs.tag_name, 'v')` gate silently skip the
      # deploy (and forward-merge get an empty tag). Resolve the tag ourselves
      # from the released version in the branch-appropriate manifest. Both
      # configs set include-v-in-tag: true, so the tag is `v<version>`. Prefer
      # the action's own output if it is ever non-empty.
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7.0.1
      - id: resolve_tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          ACTION_TAG: ${{ steps.release.outputs.tag_name }}
          MANIFEST: .release-please-manifest.json
        run: |
          tag="$ACTION_TAG"
          if [ -z "$tag" ]; then
            version="$(jq -r '.["."]' "$MANIFEST")"
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "Could not resolve released version from $MANIFEST" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          echo "Resolved release tag: $tag"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

      # Merge the Release PR here rather than by hand.
      #
      # The production environment sets `prevent_self_review`, and a
      # deployment's triggering actor is whoever pushed -- so the person who
      # merged the Release PR is the one person who cannot approve the deploy
      # it starts. That blocked v1.4.0 until a second Deployer was found.
      # Merging with FORWARD_MERGE_TOKEN makes that token's owner the actor
      # instead, so every Deployer can approve.
      #
      # This is not a new decision point: the deliberate one is the promotion
      # PR (staging -> production). By the time release-please has opened a
      # Release PR, the decision to ship has already been made, and the PR
      # only carries the version bump and changelog.
      - name: Merge the Release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FORWARD_MERGE_TOKEN }}
          PR_NUMBER: ${{ fromJson(steps.release.outputs.pr || '{}').number }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::FORWARD_MERGE_TOKEN is not set; merge the Release PR by hand."
            exit 0
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "::warning::release-please reported no Release PR number; merge it by hand."
            exit 0
          fi
          echo "Merging Release PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --squash --repo "${GITHUB_REPOSITORY}"

  # When release-please cuts a stable or hotfix release, deploy it. The
  # release is created with
  # GITHUB_TOKEN, whose events don't trigger other workflows, so we invoke the
  # production deploy inline (same run) instead of relying on the
  # `release: published` event reaching CD_production.
  deploy-production:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/CD_production.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Keep branches converged after a release:
  #   - stable release on production  -> open PR production -> staging
  #     (carries the release commit/tag history and syncs the staging manifest)
  #   - hotfix release on hotfix/v*   -> open PR hotfix/vX.Y.Z -> production
  forward-merge:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/forward-merge.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      source_branch: ${{ github.ref_name }}
    secrets: inherit
