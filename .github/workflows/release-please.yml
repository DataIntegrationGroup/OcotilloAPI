name: release-please

on:
  push:
    branches:
      - production
      - 'hotfix/v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # In manifest mode, release-please-action exposes the unprefixed
      # `release_created` boolean but only a PATH-SCOPED `.--tag_name` (the
      # unprefixed `tag_name` comes through empty). Fall back to the path-scoped
      # key so the tag reaches CD_production; without it the deploy job's
      # `startsWith(inputs.tag_name, 'v')` gate silently skips the release.
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['.--release_created'] }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  # When release-please actually cuts a release, deploy it. The release is
  # created with GITHUB_TOKEN, whose events don't trigger other workflows, so we
  # invoke the production deploy inline (same run) instead of relying on the
  # `release: published` event reaching CD_production.
  deploy-production:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/CD_production.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
