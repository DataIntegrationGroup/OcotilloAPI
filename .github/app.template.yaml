service: ${SERVICE_NAME}
runtime: python313
entrypoint: ${ENTRYPOINT}
service_account: "${CLOUD_SQL_USER}.gserviceaccount.com"
# F4_1G (2 GB) not F4 (1 GB): production runs gunicorn -w 8, and eight workers
# each importing the full stack (sqlalchemy + geoalchemy2 + shapely + cloud-sql
# connector + pygeoapi) exceeded 1 GB, so App Engine terminated processes for
# "using too much memory" and cycled workers continuously, cold-loading every
# request. See docs/app-engine-oom-instance-churn.md. Shipped to prod in v1.1.5;
# this propagates the same class to staging/testing to prevent regression.
instance_class: F4_1G
inbound_services:
  - warmup
automatic_scaling:
  min_instances: ${MIN_INSTANCES}
  max_instances: ${MAX_INSTANCES}
  max_concurrent_requests: 6
handlers:
  - url: /.*
    secure: always
    script: auto
env_variables:
  MODE: "production"
  ENVIRONMENT: "${ENVIRONMENT}"
  APP_VERSION: "${APP_VERSION}"
  DB_DRIVER: "cloudsql"
  CLOUD_SQL_INSTANCE_NAME: "${CLOUD_SQL_INSTANCE_NAME}"
  CLOUD_SQL_DATABASE: "${CLOUD_SQL_DATABASE}"
  CLOUD_SQL_USER: "${CLOUD_SQL_USER}"
  PYGEOAPI_POSTGRES_DB: "${PYGEOAPI_POSTGRES_DB}"
  PYGEOAPI_POSTGRES_USER: "${PYGEOAPI_POSTGRES_USER}"
  PYGEOAPI_POSTGRES_HOST: "${PYGEOAPI_POSTGRES_HOST}"
  PYGEOAPI_POSTGRES_PORT: "${PYGEOAPI_POSTGRES_PORT}"
  PYGEOAPI_POSTGRES_PASSWORD: |-
    ${PYGEOAPI_POSTGRES_PASSWORD}
  PYGEOAPI_SERVER_URL: "${PYGEOAPI_SERVER_URL}"
  # Hashed static API keys for the authenticated /ogcapi-internal mount, as
  # `label:sha256hex` entries, sourced from the Secret Manager secret
  # `internal-ogc-api-keys`. Needed because ArcGIS Pro and QGIS cannot refresh
  # an Authentik access token; see core/internal_ogc_auth.py and
  # docs/internal-ogc-desktop-gis.md. Unset means bearer-JWT access only.
  INTERNAL_OGC_API_KEYS: |-
    ${INTERNAL_OGC_API_KEYS}
  CLOUD_SQL_IAM_AUTH: "${CLOUD_SQL_IAM_AUTH}"
  GCS_SERVICE_ACCOUNT_KEY: |-
    ${GCS_SERVICE_ACCOUNT_KEY}
  GCS_BUCKET_NAME: "${GCS_BUCKET_NAME}"
  AUTHENTIK_URL: "${AUTHENTIK_URL}"
  AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID}"
  AUTHENTIK_AUTHORIZE_URL: "${AUTHENTIK_AUTHORIZE_URL}"
  AUTHENTIK_TOKEN_URL: "${AUTHENTIK_TOKEN_URL}"
  APITALLY_CLIENT_ID: "${APITALLY_CLIENT_ID}"
  JIRA_BASE_URL: "${JIRA_BASE_URL}"
  JIRA_EMAIL: "${JIRA_EMAIL}"
  JIRA_API_TOKEN: |-
    ${JIRA_API_TOKEN}
  JIRA_DEFAULT_PROJECT: "${JIRA_DEFAULT_PROJECT}"
  SLACK_FEEDBACK_WEBHOOK_URL: |-
    ${SLACK_FEEDBACK_WEBHOOK_URL}
  SLACK_EDITS_WEBHOOK_URL: |-
    ${SLACK_EDITS_WEBHOOK_URL}
  OCOTILLO_UI_BASE_URL: "${OCOTILLO_UI_BASE_URL}"
