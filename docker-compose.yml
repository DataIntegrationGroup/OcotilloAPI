# keep docker-compose.yml in root directory to configure with root .env

services:
  db:
    build:
      context: .
      dockerfile: ./docker/db/Dockerfile
    platform: linux/amd64
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ocotilloapi_dev
    ports:
      - 5432:5432
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ocotilloapi_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: 
      context: .
      dockerfile: ./docker/app/Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ocotilloapi_dev
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MODE=${MODE}
      - AUTHENTIK_DISABLE_AUTHENTICATION=${AUTHENTIK_DISABLE_AUTHENTICATION}
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy # <-- wait for DB to be ready
    links:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data_dev:
