# Render Blueprint for OcotilloAPI - FREE TIER
# NOTE: Free tier has 30-day database expiration and service spin-down after 15 min inactivity
# Staging environment only - upgrade to paid plans for production

envVarGroups:
  - name: ocotillo-shared
    envVars:
      - key: DB_POOL_SIZE
        value: 5  # Reduced for free tier (256MB RAM)
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: TRANSFER_PARALLEL
        value: 1
      - key: TRANSFER_WELL_SCREENS
        value: "True"
      - key: TRANSFER_SENSORS
        value: "True"
      - key: TRANSFER_CONTACTS
        value: "True"
      - key: TRANSFER_WATERLEVELS
        value: "True"
      - key: TRANSFER_WATERLEVELS_PRESSURE
        value: "True"
      - key: TRANSFER_WATERLEVELS_ACOUSTIC
        value: "True"
      - key: TRANSFER_LINK_IDS
        value: "True"
      - key: TRANSFER_GROUPS
        value: "True"
      - key: TRANSFER_ASSETS
        value: "False"
      - key: TRANSFER_SURFACE_WATER_DATA
        value: "True"
      - key: TRANSFER_HYDRAULICS_DATA
        value: "True"
      - key: TRANSFER_CHEMISTRY_SAMPLEINFO
        value: "True"
      - key: TRANSFER_RADIONUCLIDES
        value: "True"
      - key: TRANSFER_NGWMN_VIEWS
        value: "True"
      - key: TRANSFER_WATERLEVELS_PRESSURE_DAILY
        value: "True"
      - key: TRANSFER_WEATHER_DATA
        value: "True"
      - key: TRANSFER_MINOR_TRACE_CHEMISTRY
        value: "True"

  - name: ocotillo-staging
    envVars:
      - key: MODE
        value: development
      - key: AUTHENTIK_DISABLE_AUTHENTICATION
        value: 1  # Disable auth for free tier testing
      - key: AUTHENTIK_URL
        sync: false
      - key: AUTHENTIK_CLIENT_ID
        sync: false
      - key: AUTHENTIK_AUTHORIZE_URL
        sync: false
      - key: AUTHENTIK_TOKEN_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

# Database - FREE TIER (30-day expiration, 256MB RAM, 1GB storage)
databases:
  - name: ocotillo-db-staging
    databaseName: ocotillo_staging
    user: ocotillo_staging
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []

# Web service - FREE TIER (spins down after 15 min inactivity)
services:
  - type: web
    name: ocotillo-api-staging
    runtime: docker
    region: oregon
    plan: free
    branch: render-deploy  # Deploy from this branch for testing
    dockerfilePath: ./docker/app/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocotillo-db-staging
          property: connectionString
      - key: PORT
        value: 10000
      - fromGroup: ocotillo-shared
      - fromGroup: ocotillo-staging
    healthCheckPath: /health/ready
    autoDeploy: true
    buildFilter:
      paths:
        - "**/*.py"
        - "alembic/**/*"
        - "docker/**/*"
        - "pyproject.toml"
        - "uv.lock"
        - "entrypoint.sh"
        - "render.yaml"
      ignoredPaths:
        - "tests/**/*"
        - "*.md"
        - ".github/**/*"
