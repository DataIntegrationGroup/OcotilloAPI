# Render Blueprint for OcotilloAPI
# This file defines infrastructure as code for staging and production environments

# Environment variable groups shared across services
envVarGroups:
  - name: ocotillo-shared
    envVars:
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 20
      - key: TRANSFER_PARALLEL
        value: 1
      - key: TRANSFER_WELL_SCREENS
        value: "True"
      - key: TRANSFER_SENSORS
        value: "True"
      - key: TRANSFER_CONTACTS
        value: "True"
      - key: TRANSFER_WATERLEVELS
        value: "True"
      - key: TRANSFER_WATERLEVELS_PRESSURE
        value: "True"
      - key: TRANSFER_WATERLEVELS_ACOUSTIC
        value: "True"
      - key: TRANSFER_LINK_IDS
        value: "True"
      - key: TRANSFER_GROUPS
        value: "True"
      - key: TRANSFER_ASSETS
        value: "False"
      - key: TRANSFER_SURFACE_WATER_DATA
        value: "True"
      - key: TRANSFER_HYDRAULICS_DATA
        value: "True"
      - key: TRANSFER_CHEMISTRY_SAMPLEINFO
        value: "True"
      - key: TRANSFER_RADIONUCLIDES
        value: "True"
      - key: TRANSFER_NGWMN_VIEWS
        value: "True"
      - key: TRANSFER_WATERLEVELS_PRESSURE_DAILY
        value: "True"
      - key: TRANSFER_WEATHER_DATA
        value: "True"
      - key: TRANSFER_MINOR_TRACE_CHEMISTRY
        value: "True"

  - name: ocotillo-staging
    envVars:
      - key: MODE
        value: development
      - key: AUTHENTIK_DISABLE_AUTHENTICATION
        value: 0
      # Add staging-specific Authentik configuration
      - key: AUTHENTIK_URL
        sync: false  # Set in Render dashboard
      - key: AUTHENTIK_CLIENT_ID
        sync: false
      - key: AUTHENTIK_AUTHORIZE_URL
        sync: false
      - key: AUTHENTIK_TOKEN_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true  # Auto-generate secure secret
      # GCS configuration for staging
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

  - name: ocotillo-production
    envVars:
      - key: MODE
        value: production
      - key: AUTHENTIK_DISABLE_AUTHENTICATION
        value: 0
      # Add production Authentik configuration
      - key: AUTHENTIK_URL
        sync: false  # Set in Render dashboard
      - key: AUTHENTIK_CLIENT_ID
        sync: false
      - key: AUTHENTIK_AUTHORIZE_URL
        sync: false
      - key: AUTHENTIK_TOKEN_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true  # Auto-generate secure secret
      # GCS configuration for production
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

# Database services
databases:
  - name: ocotillo-db-staging
    databaseName: ocotillo_staging
    user: ocotillo_staging
    plan: standard  # Choose: free, starter, standard, pro
    region: oregon  # Choose your preferred region
    postgresMajorVersion: "17"
    ipAllowList: []  # Empty means accessible from Render services only

  - name: ocotillo-db-production
    databaseName: ocotillo_production
    user: ocotillo_production
    plan: standard  # Recommended for production
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []  # Configure IP whitelist if needed

# Web services
services:
  - type: web
    name: ocotillo-api-staging
    runtime: docker
    region: oregon
    plan: starter  # Choose: starter, standard, pro
    branch: staging  # Auto-deploy from staging branch
    dockerfilePath: ./docker/app/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocotillo-db-staging
          property: connectionString
      - key: PORT
        value: 10000  # Render default, can be overridden
      - fromGroup: ocotillo-shared
      - fromGroup: ocotillo-staging
    healthCheckPath: /health/ready
    preDeployCommand: |
      echo "Installing PostGIS extension..."
      PGPASSWORD=$PGPASSWORD psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      echo "Running database migrations..."
      alembic upgrade head
    autoDeploy: true
    buildFilter:
      paths:
        - "**/*.py"
        - "alembic/**/*"
        - "docker/**/*"
        - "pyproject.toml"
        - "uv.lock"
        - "entrypoint.sh"
        - "render.yaml"
      ignoredPaths:
        - "tests/**/*"
        - "*.md"
        - ".github/**/*"

  - type: web
    name: ocotillo-api-production
    runtime: docker
    region: oregon
    plan: standard  # Recommended for production
    branch: main  # Auto-deploy from main branch
    dockerfilePath: ./docker/app/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocotillo-db-production
          property: connectionString
      - key: PORT
        value: 10000
      - fromGroup: ocotillo-shared
      - fromGroup: ocotillo-production
    healthCheckPath: /health/ready
    preDeployCommand: |
      echo "Installing PostGIS extension..."
      PGPASSWORD=$PGPASSWORD psql $DATABASE_URL -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      echo "Running database migrations..."
      alembic upgrade head
    autoDeploy: false  # Require manual approval for production deploys
    buildFilter:
      paths:
        - "**/*.py"
        - "alembic/**/*"
        - "docker/**/*"
        - "pyproject.toml"
        - "uv.lock"
        - "entrypoint.sh"
        - "render.yaml"
      ignoredPaths:
        - "tests/**/*"
        - "*.md"
        - ".github/**/*"
